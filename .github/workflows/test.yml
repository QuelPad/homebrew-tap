name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cask:
    runs-on: macos-latest # arm64
    steps:
      - uses: actions/checkout@v4
      - name: tap this checkout
        run: |
          tap="$(brew --repository)/Library/Taps/quelpad/homebrew-tap"
          mkdir -p "$(dirname "$tap")"
          ln -s "$GITHUB_WORKSPACE" "$tap"
          brew trust quelpad/tap
      - run: brew style quelpad/tap
      - run: brew audit --cask --online --strict quelpad/tap/quelpad
      - run: brew install --cask quelpad/tap/quelpad
      - name: app and CLI landed
        run: |
          test -d /Applications/QuelPad.app
          ls -l "$(brew --prefix)/bin/quelpad"
          codesign --verify --deep --strict /Applications/QuelPad.app
          spctl --assess --type execute -v /Applications/QuelPad.app
      # First launch of a brew install, quarantine and all: the Store build once
      # shipped with a first session whose Bun worker never came up.
      - name: first launch brings up the Bun worker
        run: |
          d="$HOME/Library/Application Support/com.quelpad.app"
          xattr -l /Applications/QuelPad.app | head -5 || true
          open -a /Applications/QuelPad.app
          for i in $(seq 1 120); do
            pgrep -f 'runner\.ts' >/dev/null && break
            sleep 1
          done
          echo "--- processes"; pgrep -fl -i 'quelpad|bun' || true
          echo "--- app data"; ls "$d" || true; ls "$d/app-packages" 2>/dev/null | head || true
          echo "--- logs"; tail -n 40 "$HOME/Library/Logs/com.quelpad.app/"* 2>/dev/null || true
          pgrep -f 'runner\.ts' >/dev/null
          test -f "$d/samples/chinook.sqlite"
      - name: CLI reads the sample database
        run: quelpad schema --connect chinook | head -30
      - name: quit
        if: always()
        run: osascript -e 'quit app "QuelPad"' || true
      - run: brew uninstall --cask quelpad
